name: Verify and publish Input Lab

on:
  push:
    branches: [main]
    tags: ['inputlab-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inputlab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, self-test and package Input Lab
        shell: powershell
        run: ./tools/InputLab/package.ps1
      - name: Read packaged version
        id: version
        shell: powershell
        run: |
          $files = @(Get-ChildItem ./artifacts/InputLab/release/InputLab-*-Windows-x64.exe)
          if ($files.Count -ne 1) { throw "Expected exactly one packaged Input Lab EXE, found $($files.Count)." }
          $exe = $files[0]
          $version = $exe.VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Input Lab ProductVersion is missing.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $expected = "inputlab-v$version"
            if ($env:GITHUB_REF_NAME -ne $expected) {
              throw "Tag $env:GITHUB_REF_NAME does not match packaged Input Lab version $version (expected $expected)."
            }
          }
      - name: Run repository regression
        shell: powershell
        run: ./tests/Run-Tests.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: InputLab-${{ steps.version.outputs.version }}-Windows-x64
          path: |
            artifacts/InputLab/release/InputLab-${{ steps.version.outputs.version }}-Windows-x64.exe
            artifacts/InputLab/release/InputLab-${{ steps.version.outputs.version }}-Windows-x64.zip
            artifacts/InputLab/release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/inputlab-v')
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: InputLab-${{ needs.verify.outputs.version }}-Windows-x64
          path: artifacts/InputLab/release
      - name: Publish Input Lab prerelease without changing InputStitch latest
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTLAB_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "artifacts/InputLab/release/InputLab-$env:INPUTLAB_VERSION-Windows-x64.exe" `
            "artifacts/InputLab/release/InputLab-$env:INPUTLAB_VERSION-Windows-x64.zip" `
            "artifacts/InputLab/release/SHA256SUMS.txt" `
            --title "Input Lab v$env:INPUTLAB_VERSION" `
            --notes-file tools/InputLab/RELEASE_NOTES.md `
            --prerelease `
            --verify-tag
