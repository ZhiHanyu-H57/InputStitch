name: Build and publish Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.1.0"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and verify release files
        shell: powershell
        run: .\build.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: InputStitch-1.1.0-Windows
          path: |
            dist/InputStitch-1.1.0-Windows-x64.exe
            dist/InputStitch-1.1.0-Windows-x86.exe
            dist/InputStitch-1.1.0-Source.zip
            dist/InputStitch-update.xml
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/tags/v1.1.0'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "dist/InputStitch-1.1.0-Windows-x64.exe",
            "dist/InputStitch-1.1.0-Windows-x86.exe",
            "dist/InputStitch-1.1.0-Source.zip",
            "dist/InputStitch-update.xml",
            "dist/SHA256SUMS.txt"
          )
          $ErrorActionPreference = "Continue"
          gh release view "v1.1.0" --json tagName 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = "Stop"
          if ($releaseExists) {
            throw "Release v1.1.0 already exists. Existing public releases must not be overwritten."
          } else {
            gh release create "v1.1.0" $assets --target "$env:GITHUB_SHA" --title "InputStitch 1.1.0" --notes-file "RELEASE_NOTES.md"
            if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub release." }
          }
