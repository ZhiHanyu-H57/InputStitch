name: Publish InputStitch 1.1.0 once
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-once.yml"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 37c48908234cb2c14e5a7630be280f2ab0f41fbf
      - name: Build and verify
        shell: powershell
        run: .\build.ps1
      - name: Create new version and publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag v1.1.0 37c48908234cb2c14e5a7630be280f2ab0f41fbf
          if ($LASTEXITCODE -ne 0) { throw "Could not create new tag." }
          git push origin refs/tags/v1.1.0
          if ($LASTEXITCODE -ne 0) { throw "Could not publish new tag. No existing tag will be overwritten." }
          gh release create v1.1.0 dist/InputStitch-1.1.0-Windows-x64.exe dist/InputStitch-1.1.0-Windows-x86.exe dist/InputStitch-1.1.0-Source.zip dist/InputStitch-update.xml dist/SHA256SUMS.txt --verify-tag --latest --title "InputStitch 1.1.0" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed." }
