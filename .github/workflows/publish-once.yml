name: Finalize InputStitch 1.0.0 once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-once.yml"

permissions:
  contents: write

jobs:
  refresh-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8ec4cf40814942330adbe55b5b2286d00837c824
          fetch-depth: 0
      - name: Build and verify release files
        shell: powershell
        run: .\build.ps1
      - name: Move v1.0.0 tag to validated source
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v1.0.0" "8ec4cf40814942330adbe55b5b2286d00837c824"
          git push origin "refs/tags/v1.0.0" --force
      - name: Replace existing v1.0.0 release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "dist/InputStitch-1.0.0-Windows-x64.exe",
            "dist/InputStitch-1.0.0-Windows-x86.exe",
            "dist/InputStitch-1.0.0-Source.zip",
            "dist/InputStitch-update.xml",
            "dist/SHA256SUMS.txt"
          )
          gh release upload "v1.0.0" $assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to replace release assets." }
          gh release edit "v1.0.0" --title "InputStitch 1.0.0" --notes-file "RELEASE_NOTES.md"
          if ($LASTEXITCODE -ne 0) { throw "Failed to update release notes." }
